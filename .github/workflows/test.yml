name: Connector tests

# Trigger-Modell 2026-06-21 (Backlog #15): Mac = Default-Test-Runner, GitHub
# nur wenn weg vom Mac. KEIN push:main-Trigger — der Mac fährt pytest vor
# jedem Push lokal über den scripts/githooks/pre-push-Hook. CI hier feuert
# nur auf PRs (= Arbeit weg vom Mac, z.B. Claude Code on the web) + einem
# nächtlichen Backstop auf main. Manuell: workflow_dispatch.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    # 04:17 UTC nächtlicher Backstop auf main (schedule läuft immer auf main).
    - cron: "17 4 * * *"

concurrency:
  group: connector-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install deps
        run: pip install -r requirements-test.txt

      - name: Run pytest
        # Die beiden deselektierten sse_client-Tests sind der bekannte
        # umgebungsabhängige aiodns/aiohttp-Drift in frischen venvs
        # (siehe CLAUDE.md) — in CI deterministisch raus.
        run: >
          pytest -v
          --deselect tests/test_sse_client.py::test_start_is_idempotent
          --deselect tests/test_sse_client.py::test_stop_cancels_running_task
